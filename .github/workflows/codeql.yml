name: "CodeQL"

on:
  push:
    branches: [ main ]
    # Documentation-only changes need no code analysis; the weekly scheduled scan
    # runs anyway.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'third_party/**'
      - '.gitignore'
  # NO paths-ignore here: `Analyze (java-kotlin)` is a required check on `main`.
  # Skipped, it reports no status and blocks the PR forever. The filter stays on
  # `push`, where there is nothing to re-analyse.
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The composite action rather than a bare setup-java, for the Gradle cache:
      # `build-mode: autobuild` really compiles the plugin, so without a cache each
      # analysis downloads the IntelliJ SDK (~1 GB) again. Read-only: this workflow
      # uses the cache written by build.yml without growing the repository budget.
      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: java-kotlin
          build-mode: autobuild
          # security-and-quality suite, excluding generated code.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:java-kotlin"
          # Not uploaded directly: generated code is filtered out first.
          upload: false
          output: sarif-results

      # paths-ignore has no effect for compiled languages, so alerts on the
      # generated parser (src/main/gen) are removed from the SARIF before upload,
      # with jq (no hard-coded file name, no third-party action).
      - name: Filter generated code out of the SARIF
        run: |
          set -euo pipefail
          for sarif in sarif-results/*.sarif; do
            echo "Filtering $sarif"
            jq '.runs |= map(.results |= map(select(
                  [ .locations[]?.physicalLocation.artifactLocation.uri // "" ]
                  | any(contains("src/main/gen/")) | not )))' \
               "$sarif" > "$sarif.tmp"
            mv "$sarif.tmp" "$sarif"
          done

      - name: Upload the filtered SARIF
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: sarif-results
          category: "/language:java-kotlin"
