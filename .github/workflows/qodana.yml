name: Qodana

# JetBrains static analysis (Qodana Community for JVM). It complements CodeQL:
# CodeQL analyses generic Java/Kotlin, while Qodana knows the IntelliJ Platform
# APIs and reports plugin-specific misuse. Results go to GitHub code scanning next
# to CodeQL and poutine; no Qodana Cloud account is needed.
#
# Triggers: `main` and weekly, NOT every PR. PRs are already guarded by CodeQL and
# the tests (required checks); the point here is to keep the default branch's state
# current in the Security tab without slowing every PR with a second heavy analysis.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'third_party/**'
      - '.gitignore'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # fetch-depth: 0 because Qodana ties its results to the history.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Qodana does not fail the workflow on findings: it informs, it does not gate.
      # That comes from the absence of `failThreshold` in qodana.yaml, not from an
      # action input. The blocking gate is CodeQL and the tests, required on `main`;
      # results stay visible under Security.
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.1
        with:
          upload-result: true
          post-pr-comment: false
          use-caches: true
          # On a pull request the action switches to `pr-mode` and only analyses the
          # diff. Fine for PR feedback, useless here: this workflow tracks the default
          # branch, and a PR touching no Kotlin would produce an empty report that
          # reads as "nothing to report".
          pr-mode: false

      - name: Upload the Qodana SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana
