name: Dependency check (OWASP)

# UPDATER role in the "single updater + readers" strategy OWASP recommends for
# caching the H2 database (odc.mv.db). This job (scheduled and manual) updates the
# NVD database, scans, then ARCHIVES the `data` dir in the `nvd-cache` release.
# Reader jobs (such as publish) restore it and scan with autoUpdate disabled,
# making no NVD calls.
#
# Kept off the push/PR path: building the NVD 2.0 database is slow and must not
# block commits. Pushes and PRs stay covered by CodeQL and Dependabot.
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      seed_data_url:
        description: "URL of a pre-built NVD database zip (one-off bootstrap)"
        required: false
        default: ""

# contents: write to publish the NVD database archive in the nvd-cache release.
permissions:
  contents: write

env:
  NVD_CACHE_TAG: nvd-cache
  NVD_CACHE_ASSET: nvd-data.zip

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: OWASP update + scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle

      # Restores the previous NVD database (nvd-cache release) or a manual seed, for
      # an INCREMENTAL update instead of a full download. unzip keeps mtimes, which
      # matters for the validity of the `cache` subfolder (see the OWASP docs).
      - name: Restore the existing NVD database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED_URL: ${{ github.event.inputs.seed_data_url }}
        run: |
          set -uo pipefail
          mkdir -p ~/.gradle/dependency-check-data
          if [ -n "${SEED_URL:-}" ]; then
            echo "Bootstrapping from the given URL."
            curl -fsSL "$SEED_URL" -o /tmp/nvd-data.zip || true
          else
            echo "Restoring from release $NVD_CACHE_TAG (if it exists)."
            gh release download "$NVD_CACHE_TAG" --pattern "$NVD_CACHE_ASSET" \
              --output /tmp/nvd-data.zip --clobber || echo "(no existing archive)"
          fi
          if [ -f /tmp/nvd-data.zip ]; then
            unzip -q -o /tmp/nvd-data.zip -d ~/.gradle/dependency-check-data && rm -f /tmp/nvd-data.zip
          fi

      - name: NVD update + scan (fails on CVE >= 7.0)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      # Archives the updated database and publishes it for reader jobs. Only runs if
      # the scan succeeded (complete database), so a partial database is never
      # published. zip keeps mtimes.
      - name: Archive and publish the NVD database (nvd-cache release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d ~/.gradle/dependency-check-data ]; then
            echo "No data dir to archive."; exit 0
          fi
          ( cd ~/.gradle/dependency-check-data && zip -r -q "$GITHUB_WORKSPACE/$NVD_CACHE_ASSET" . )
          gh release view "$NVD_CACHE_TAG" >/dev/null 2>&1 \
            || gh release create "$NVD_CACHE_TAG" --title "NVD data cache (internal)" \
                 --notes "OWASP dependency-check H2 database, refreshed automatically. Not a plugin release." \
                 --prerelease
          gh release upload "$NVD_CACHE_TAG" "$NVD_CACHE_ASSET" --clobber

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html
          retention-days: 30
