name: IntelliJ compatibility (Plugin Verifier)

# Checks the plugin's binary compatibility against several IntelliJ versions
# (removed or deprecated APIs) with JetBrains' Plugin Verifier. If a new IntelliJ
# version breaks an API the plugin uses, an issue is opened with the details.
#
# Heavy (downloads each IDE, ~1 GB), so scheduled and manual only, never on push.
on:
  schedule:
    - cron: '0 3 * * 6'   # Saturday 03:00 UTC
  workflow_dispatch:
    inputs:
      ide_versions:
        description: "IntelliJ versions to verify (e.g. IC-2024.1.7,IC-2025.1). Empty = default list."
        required: false
        default: ""

# Minimal permissions: read the repository, write issues for the alert.
permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Plugin Verifier
    runs-on: ubuntu-latest
    # Generous: the verifier downloads each IDE (~1 GB).
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Determine the IntelliJ versions to verify
        id: versions
        # Source: the official list of builds the Plugin Verifier can test
        # (jb.gg/intellij-platform-builds-list), which is EXACTLY what the verifier
        # can download. That avoids "cannot be downloaded" errors, and the list moves
        # forward by itself when JetBrains adds versions.
        # The latest patch of EVERY major version since the target is verified, not
        # just both ends: an API removed in one version and restored in a later one
        # would slip through otherwise. The job is weekly, so the extra IDEs are fine.
        # OVERRIDE comes through env and is never interpolated into the script, so
        # there is no injection.
        env:
          OVERRIDE: ${{ github.event.inputs.ide_versions }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            IDE_VERSIONS="$OVERRIDE"
          else
            BASE="IC-2024.1.7"
            ALL=$(curl -fsSL "https://jb.gg/intellij-platform-builds-list" \
              | grep -oE 'IC-20[0-9]{2}\.[0-9]+(\.[0-9]+)?' | sort -uV)
            # Drops majors older than the base (sinceBuild=241), then keeps the latest
            # patch of each, in version order.
            PER_MAJOR=$(printf '%s\n' "$ALL" \
              | awk -F'[-.]' '$2>2024 || ($2==2024 && $3>=1)' \
              | awk -F. '{maj=$1"."$2; last[maj]=$0; ord[maj]=NR} END{for(m in last) print ord[m]"\t"last[m]}' \
              | sort -n | cut -f2)
            # The base stays explicit: if JetBrains drops 2024.1 from the list, what the
            # plugin declares it supports is still verified.
            IDE_VERSIONS=$(printf '%s\n%s\n' "$BASE" "$PER_MAJOR" \
              | awk 'NF && !seen[$0]++' | paste -sd,)
          fi
          echo "Verified versions: $IDE_VERSIONS"
          echo "ide_versions=$IDE_VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Plugin Verifier
        id: verify
        # IDE_VERSIONS comes through env and is used as a shell variable, never
        # interpolated with ${{ }} into the script (no injection).
        env:
          IDE_VERSIONS: ${{ steps.versions.outputs.ide_versions }}
        run: |
          set -o pipefail
          ./gradlew verifyPlugin -PpluginVerifierIdeVersions="$IDE_VERSIONS" 2>&1 | tee verifier-output.txt

      - name: Upload the verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: |
            verifier-output.txt
            build/reports/pluginVerifier/
          retention-days: 14

      - name: Open or update an issue on incompatibility
        if: failure() && steps.verify.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('verifier-output.txt', 'utf8'); } catch (e) {}
            const tail = report.slice(-4000);
            const label = 'intellij-compat';
            const title = "Plugin Verifier: IntelliJ incompatibility detected";
            const body = [
              "The Plugin Verifier detected a binary incompatibility with an IntelliJ",
              "version (removed or changed API). The plugin code probably needs a fix.",
              "",
              `Run: ${process.env.RUN_URL}`,
              "",
              "<details><summary>Verifier output (tail)</summary>",
              "",
              "```",
              tail,
              "```",
              "</details>",
            ].join("\n");
            const { owner, repo } = context.repo;
            // Avoid duplicates: reuse an open issue with the label.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number,
                body: `Detected again.\n\nRun: ${process.env.RUN_URL}`,
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
