name: Pipeline SAST (poutine)

# Static analysis of the CI/CD workflows themselves (GitHub Actions) with
# BoostSecurity's poutine: detects pipeline misconfigurations such as command
# injection, dangerous pull_request_target use, Dependabot "pwn requests" and
# unpinned actions. Results go to Security → Code scanning (SARIF). It does not
# fail the build; findings are surfaced for triage.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'third_party/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'third_party/**'
      - '.gitignore'
  # Periodic scan: re-checks existing workflows against the latest poutine rules,
  # even without a new push (Monday 04:00 UTC).
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poutine:
    name: Pipeline analysis (poutine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: poutine - GitHub Actions SAST
        uses: boostsecurityio/poutine-action@v1.1.4

      - name: Upload poutine SARIF
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: results.sarif
