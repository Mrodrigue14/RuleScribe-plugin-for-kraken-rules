name: Signing check

# Dry run of the signing chain (build → signPlugin → verifyPluginSignature)
# WITHOUT publishing or tagging anything. Use it to validate the signing secrets
# before a release, since signing that breaks during `publish` means deleting the
# tag and starting over, and again after rotating or renewing the certificate.
on:
  workflow_dispatch:

# Read-only: this workflow publishes nothing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-check:
    name: Sign and verify (dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Build, sign and verify
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin signPlugin verifyPluginSignature

      # Without this check, missing secrets would just skip signPlugin and this
      # workflow would pass without signing anything.
      - name: Confirm a signed artifact was produced
        run: |
          set -euo pipefail
          if ! ls build/distributions/*-signed.zip >/dev/null 2>&1; then
            echo "::error::No signed artifact produced. Are the CERTIFICATE_CHAIN / PRIVATE_KEY / PRIVATE_KEY_PASSWORD secrets configured?"
            exit 1
          fi
          ls -lh build/distributions/*-signed.zip

      # The certificate is public: printing its subject and expiry date discloses
      # nothing and avoids discovering an expiry on release day.
      - name: Certificate identity and expiry
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          set -euo pipefail
          printf '%s' "$CERTIFICATE_CHAIN" > chain.crt
          openssl x509 -in chain.crt -noout -subject -issuer -enddate
          END_EPOCH=$(date -d "$(openssl x509 -in chain.crt -noout -enddate | cut -d= -f2)" +%s)
          DAYS=$(( (END_EPOCH - $(date +%s)) / 86400 ))
          echo "Expires in $DAYS days."
          if [ "$DAYS" -lt 30 ]; then
            echo "::warning::The signing certificate expires in $DAYS days; plan its renewal."
          fi
