name: Release integrity

# Drift detection: checks that the latest version on the JetBrains Marketplace
# matches a GitHub Release produced by the pipeline (releases are ONLY created by
# publish.yml, after build, provenance attestation and tests/CodeQL/OWASP). A
# Marketplace version WITHOUT a matching release means an upload outside the
# pipeline, and an issue is opened automatically.
on:
  schedule:
    - cron: '0 7 * * *'   # every day 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PLUGIN_ID: "32804"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  drift:
    name: Check Marketplace / pipeline consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare the Marketplace version with attested releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tells gh the repository without needing a git checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Latest version published on the Marketplace.
          MP_VERSION=$(curl -fsSL \
            "https://plugins.jetbrains.com/api/plugins/${PLUGIN_ID}/updates?size=1" \
            | jq -r '.[0].version')
          echo "Latest Marketplace version: $MP_VERSION"

          if [ -z "$MP_VERSION" ] || [ "$MP_VERSION" = "null" ]; then
            echo "Could not read the Marketplace version; not alerting (transient)."
            exit 0
          fi

          # A pipeline-produced release must exist for this version.
          if gh release view "v${MP_VERSION}" >/dev/null 2>&1; then
            echo "OK: GitHub Release v${MP_VERSION} exists (published by the pipeline)."
            exit 0
          fi

          echo "::warning::No GitHub Release for v${MP_VERSION}; possible drift."

          # Idempotent label (gh issue create fails if the label does not exist).
          gh label create release-integrity \
            --color B60205 --description "Marketplace / pipeline drift" 2>/dev/null || true

          # Avoid duplicates: do not open another issue for this version.
          TITLE="Release integrity: Marketplace v${MP_VERSION} without a pipeline release"
          EXISTING=$(gh issue list --state open --label release-integrity \
            --search "in:title v${MP_VERSION}" --json number --jq 'length')
          if [ "${EXISTING:-0}" != "0" ]; then
            echo "Issue already open for v${MP_VERSION}."
            exit 0
          fi

          BODY=$(printf '%s\n' \
            "Version **${MP_VERSION}** is published on the JetBrains Marketplace, but" \
            "no GitHub Release \`v${MP_VERSION}\` exists." \
            "" \
            "Releases are only created by the \`publish.yml\` pipeline (after build," \
            "provenance attestation and tests/CodeQL/OWASP). A Marketplace version without" \
            "a matching release points to an **upload outside the pipeline**; please check." \
            "" \
            "To verify manually, download the zip from the Marketplace, then run" \
            "\`gh attestation verify <zip> --repo ${GITHUB_REPOSITORY}\`.")

          gh issue create --title "$TITLE" --body "$BODY" --label release-integrity
