name: Publish

# Publishes the plugin to the JetBrains Marketplace AND creates a GitHub Release,
# triggered by a version tag (e.g. v0.5.8). Every tag is a deliberate public
# release.
#
# Requires the JETBRAINS_MARKETPLACE_TOKEN secret (Marketplace → My Tokens).
# Typical flow: bump `version` in build.gradle.kts → commit →
#   git tag v0.5.8 && git push origin v0.5.8
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# contents: write to create the GitHub Release. The Marketplace token goes through
# a dedicated secret (PUBLISH_TOKEN), never through GITHUB_TOKEN.
permissions:
  contents: write        # create the GitHub Release
  id-token: write        # sign the provenance attestation (OIDC)
  attestations: write    # write the build attestation

# Serialises publications but NEVER cancels one in progress: a half-done
# publishPlugin must not be killed. Extra runs wait their turn.
concurrency:
  group: publish-marketplace
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (Marketplace + GitHub Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle

      # Guard: the tag (without "v") must match the version in build.gradle.kts, so
      # an inconsistent version is never published. Skipped on manual runs (no tag).
      - name: Check tag / version consistency
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FILE_VERSION=$(grep -oE 'version = "[^"]+"' build.gradle.kts | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          TAG_VERSION="${TAG#v}"
          echo "Tag: $TAG_VERSION  |  build.gradle.kts: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::The tag ($TAG_VERSION) does not match the build.gradle.kts version ($FILE_VERSION)."
            exit 1
          fi

      - name: Tests + verification (nothing is published if this fails)
        run: ./gradlew test verifyPluginProjectConfiguration

      # Build THEN sign, in that order and BEFORE the attestation: the signed
      # artifact is what goes to the Marketplace, so it is what must be attested;
      # otherwise a downloaded zip would not have the attested digest. signPlugin
      # is skipped when signing secrets are missing (see build.gradle.kts).
      # verifyPluginSignature re-reads the signed archive and checks the signature
      # against the certificate, so a malformed or mismatched key fails the
      # release here, before anything is published or attested.
      - name: Build and sign the plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew buildPlugin signPlugin verifyPluginSignature

      # Selects the artifact actually distributed: the signed zip if it exists,
      # otherwise the plain zip. Used for the GitHub Release, so users download
      # exactly what was attested.
      - name: Identify the distributed artifact
        id: artifact
        # Selection is anchored on the tag version (not "the first zip found"), so
        # it is deterministic even if the folder holds older builds.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ARTIFACT=$(ls build/distributions/*-"${VERSION}"-signed.zip 2>/dev/null | head -1 || true)
          if [ -n "$ARTIFACT" ]; then
            echo "Signed plugin: $ARTIFACT"
          else
            ARTIFACT=$(ls build/distributions/*-"${VERSION}".zip | head -1)
            echo "::warning::Plugin NOT signed (signing secrets missing): $ARTIFACT"
          fi
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # SLSA provenance attestation: cryptographically binds the shipped zip to the
      # commit, workflow and runner that produced it. Anyone can then verify a
      # release (even one downloaded from the Marketplace) with:
      #   gh attestation verify rulescribe-X.Y.Z.zip \
      #     --repo Mrodrigue14/RuleScribe-plugin-for-kraken-rules
      # A zip uploaded outside the pipeline fails this check.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}

      # CycloneDX SBOM of the shipped artifact (runtimeClasspath scope, see
      # build.gradle.kts). It complements the OWASP report: the report is a dated
      # VERDICT that expires with the next published CVE, while the SBOM is a
      # lasting machine-readable INVENTORY that users can rescan themselves.
      - name: Generate the SBOM
        run: ./gradlew cyclonedxDirectBom

      # Attested, so cryptographically bound to the zip: the SBOM is verified with
      # the same `gh attestation verify` as the provenance.
      #
      # `actions/attest-sbom` is deprecated in favour of the generic
      # `actions/attest`, where the predicate type becomes explicit. Its value is
      # fixed: the release notes publish it in the verification command and past
      # attestations carry it, so changing it would break verification of past and
      # future releases.
      - name: Attest the SBOM
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.path }}
          predicate-type: https://cyclonedx.org/bom
          predicate-path: build/reports/cyclonedx-direct/rulescribe-sbom.json

      # READER role in the OWASP "single updater + readers" strategy: restores the
      # pre-built NVD database from the `nvd-cache` release (maintained by the
      # dependency-check workflow), then scans with autoUpdate DISABLED, making no
      # NVD calls. If the archive does not exist yet, falls back to a full (slow)
      # update so the release is not blocked. Runs BEFORE publishing, so nothing is
      # published if the scan fails.
      - name: Rapport OWASP Dependency-Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p ~/.gradle/dependency-check-data
          if gh release download nvd-cache --pattern nvd-data.zip \
               --output /tmp/nvd-data.zip --clobber 2>/dev/null; then
            unzip -q -o /tmp/nvd-data.zip -d ~/.gradle/dependency-check-data
            rm -f /tmp/nvd-data.zip
            echo "NVD database restored from nvd-cache → scanning without update."
            ./gradlew dependencyCheckAnalyze -PodcAutoUpdate=false
          else
            echo "No nvd-cache archive → full NVD update (slow)."
            ./gradlew dependencyCheckAnalyze
          fi
          cp build/reports/dependency-check-report.html "dependency-check-report-${VERSION}.html"

      # publishPlugin runs signPlugin first: with the three signing secrets the
      # published artifact is signed (the IDE can verify it); without them
      # signPlugin is skipped and the plugin is published unsigned.
      - name: Publish to the JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        # TAG/COMMIT come through env and are used as shell variables, never
        # interpolated with ${{ }} into the script (no injection). Notes are the
        # plugin.xml <change-notes> block plus an OWASP section proving the attached
        # report belongs to this release (version, commit, SHA-256 digest).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ARTIFACT: ${{ steps.artifact.outputs.path }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          REPORT="dependency-check-report-${VERSION}.html"
          SHA=$(sha256sum "$REPORT" | awk '{print $1}')

          SBOM="rulescribe-sbom-${VERSION}.json"
          cp build/reports/cyclonedx-direct/rulescribe-sbom.json "$SBOM"
          SBOM_COMPONENTS=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1]))\
            .get('components', [])))" "$SBOM")

          # The signing certificate is published with the release: without it nobody
          # can verify the zip signature, and the "verify it yourself" section of
          # SECURITY.md would promise more than it allows. A certificate is PUBLIC;
          # only the private key is secret, and it never leaves GitHub secrets.
          CERT=""
          CERT_FP=""
          if [ -n "${CERTIFICATE_CHAIN:-}" ]; then
            CERT="rulescribe-signing-certificate.crt"
            printf '%s' "$CERTIFICATE_CHAIN" > "$CERT"
            CERT_FP=$(openssl x509 -in "$CERT" -noout -fingerprint -sha256 \
              | cut -d= -f2)
          fi

          # Release notes from plugin.xml (otherwise a minimal header).
          if ! python3 .github/scripts/extract-notes.py "$VERSION" > RELEASE_NOTES.md || [ ! -s RELEASE_NOTES.md ]; then
            printf 'RuleScribe %s\n' "$VERSION" > RELEASE_NOTES.md
          fi

          # OWASP section: proves the report matches the release. (The echos are
          # indented for YAML; the Markdown content itself stays clean.)
          {
            echo ""
            echo "---"
            echo ""
            echo "## OWASP Dependency-Check report"
            echo ""
            echo "The dependency vulnerability scan for **this exact release** is attached: \`$REPORT\`."
            echo ""
            echo "| Field | Value |"
            echo "| ----- | ----- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Report SHA-256 | \`$SHA\` |"
            echo ""
            echo "Result: **0 vulnerable dependencies** — the shipped artifact bundles no third-party libraries (scan scoped to the runtime classpath). Generated by this release's CI run from the tagged commit above."
            echo ""
            echo "Verify the attached file matches this release:"
            echo ""
            echo '```'
            echo "sha256sum $REPORT   # must equal the SHA-256 above"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "## Software Bill of Materials"
            echo ""
            echo "\`$SBOM\` (CycloneDX 1.6) lists what the shipped artifact contains: **$SBOM_COMPONENTS third-party components**, scoped to the runtime classpath like the scan above."
            echo ""
            echo "The OWASP report is a **verdict** — accurate on the day it was produced, and it ages as new CVEs are published. The SBOM is an **inventory**: it does not age, and it lets you re-scan this release against your own vulnerability feed at any time, without waiting on us."
            echo ""
            echo "It is attested, so it is bound to this exact artifact:"
            echo ""
            echo '```'
            echo "gh attestation verify $(basename "$ARTIFACT") \\"
            echo "  --repo $GITHUB_REPOSITORY --predicate-type https://cyclonedx.org/bom"
            echo '```'
          } >> RELEASE_NOTES.md

          # Signing section: the public certificate verifies the zip, and its digest
          # shows it is the same publishing key as in previous releases.
          if [ -n "$CERT" ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "## Plugin signature"
              echo ""
              echo "The published artifact is signed. The publisher certificate is attached as \`$CERT\` so you can verify the signature yourself."
              echo ""
              echo "| Field | Value |"
              echo "| ----- | ----- |"
              echo "| Certificate SHA-256 | \`$CERT_FP\` |"
              echo ""
              echo "The fingerprint is identical across releases signed with the same key: a change means the publishing identity changed, and would be announced."
              echo ""
              echo "Verify with JetBrains' [marketplace-zip-signer](https://github.com/JetBrains/marketplace-zip-signer):"
              echo ""
              echo '```'
              echo "java -jar marketplace-zip-signer-cli.jar verify \\"
              echo "  -in $(basename "$ARTIFACT") -cert $CERT"
              echo '```'
            } >> RELEASE_NOTES.md
          fi

          echo "--- Release notes ---"; cat RELEASE_NOTES.md
          # shellcheck disable=SC2086 — $CERT is empty when unsigned, and it should
          # then vanish from the asset list rather than become an empty "" argument.
          gh release create "$TAG" \
            "$ARTIFACT" \
            "$REPORT" \
            "$SBOM" \
            $CERT \
            --title "$TAG" \
            --notes-file RELEASE_NOTES.md
