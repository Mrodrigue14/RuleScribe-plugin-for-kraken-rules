name: Build

on:
  push:
    branches: [ main ]
    # Skip the build and scans for documentation-only changes (README, ROADMAP,
    # LICENSE…): they cannot break the code or add a vulnerability. A push that
    # also touches code still triggers the workflow.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
      - 'third_party/**'
      - '.gitignore'
  # NO paths-ignore here: this job is a required check on `main`. A skipped
  # workflow reports no status, and a required check that never reports stays
  # "Expected", so the PR could never be merged. The filter stays on `push`:
  # after a documentation-only PR is merged there is nothing to re-test.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancels the outdated run when a new push arrives on the same ref (event_name is
# in the key so that a scheduled run does not cancel a push run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The only workflow allowed to WRITE the Gradle cache (see the composite action).
      - name: Setup Java + Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: "false"

      # Style before tests: it takes seconds and fails on mechanical issues, while
      # the test suite takes minutes.
      - name: Style Kotlin
        run: ./gradlew ktlintCheck

      # koverVerify runs the tests, then checks the coverage floor.
      # -PwarningsAsErrors=true: strict in CI, lenient locally, so compiler warnings
      # do not pile up on the stable branch.
      - name: Tests + couverture
        run: ./gradlew koverVerify koverHtmlReport -PwarningsAsErrors=true

      - name: Build the plugin
        run: ./gradlew buildPlugin -PwarningsAsErrors=true

      - name: Verify the plugin (zip structure)
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Publier l'artefact
        uses: actions/upload-artifact@v7
        with:
          name: rulescribe
          path: build/distributions/*.zip
          retention-days: 30

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/html/
          retention-days: 14

      - name: Test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
