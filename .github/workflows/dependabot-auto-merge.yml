name: Dependabot auto-merge

# Auto-merges Dependabot PRs once CI is green.
#
# SECURITY: this workflow follows GitHub's official pattern and closes the
# "pwn request" vectors described by BoostSecurity:
#
#   1. `pull_request` trigger (NEVER `pull_request_target`): the job has no access
#      to repository secrets, so there is nothing to exfiltrate even from a
#      malicious PR.
#   2. NO `checkout` and no execution of PR code, so no untrusted code runs.
#   3. The author is checked through `github.event.pull_request.user.login` (not
#      spoofable), NOT `github.actor` (spoofable on synchronize through
#      `@dependabot recreate`).
#   4. No attacker-controlled data (branch name, title…) is interpolated into a
#      `run:`; only `html_url`, generated by GitHub, is passed through an
#      environment variable, so there is no command injection.
#   5. Minimal permissions (contents and pull-requests write, nothing else).
#   6. Metadata comes from the verified `dependabot/fetch-metadata` action rather
#      than custom logic.
#
# The merge itself is left to GitHub's native auto-merge (`--auto`), which only
# completes once the required checks pass. The required checks ("Build & test"
# and "CodeQL") must therefore be configured on `main` (see SECURITY.md and the
# README), or nothing enforces the CI gate.
on: pull_request

# Minimal permissions, granted to this workflow only.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only runs for PRs whose real AUTHOR is Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A PR that ONLY touches workflows actually run on pull requests is proven by
      # its own checks: if the bumped action breaks, the PR turns red and nothing
      # is merged.
      #
      # That is not true of `publish.yml`, triggered only by a tag: a broken action
      # would only show up during a release, the worst possible moment. Those PRs
      # stay under manual review, whatever the kind of bump.
      - name: Check whether the PR is covered by the checks
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Workflows not exercised by PR checks (scheduled or tag-triggered).
          UNCOVERED='^\.github/workflows/(publish|release-integrity|dependency-check|signing-check|plugin-verifier)\.yml$'
          FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "Changed files:"; echo "$FILES" | sed 's/^/  /'
          if echo "$FILES" | grep -qE "$UNCOVERED"; then
            echo "covered=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This PR touches a workflow not covered by PR checks; manual review required."
          else
            echo "covered=true" >> "$GITHUB_OUTPUT"
          fi

      # Patch and minor: auto-merge, whatever the ecosystem. Major: only for GitHub
      # Actions, and only if the PR touches no workflow outside the checks' scope.
      # Major Gradle bumps stay manual: a break there is far subtler than a `uses:`
      # that fails immediately.
      - name: Enable auto-merge
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          (steps.meta.outputs.package-ecosystem == 'github_actions' &&
           steps.scope.outputs.covered == 'true')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
