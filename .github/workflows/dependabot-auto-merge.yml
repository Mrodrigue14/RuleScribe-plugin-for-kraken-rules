name: Dependabot auto-merge

# Auto-merge des PRs Dependabot une fois la CI verte.
#
# SÉCURITÉ — ce workflow suit le patron officiel GitHub et neutralise les
# vecteurs "pwn request" décrits par boostsecurity :
#
#   1. Déclencheur `pull_request` (JAMAIS `pull_request_target`) : le job n'a
#      pas accès aux secrets du dépôt — rien à exfiltrer même si la PR est
#      malveillante.
#   2. AUCUN `checkout` ni exécution du code de la PR : pas d'exécution de code
#      non fiable, donc pas de RCE.
#   3. Vérification de l'auteur via `github.event.pull_request.user.login`
#      (le champ non falsifiable) et NON `github.actor` (falsifiable sur
#      synchronize via `@dependabot recreate`).
#   4. Aucune interpolation de donnée contrôlable (nom de branche, titre…)
#      dans un `run:` — on ne passe que `html_url` (généré par GitHub) via une
#      variable d'environnement : pas d'injection de commande.
#   5. Permissions minimales (contents + pull-requests en write, rien d'autre).
#   6. Métadonnées obtenues via l'action vérifiée `dependabot/fetch-metadata`
#      plutôt qu'une logique maison.
#
# Le merge effectif est délégué à l'auto-merge natif de GitHub (`--auto`), qui
# n'aboutit QUE lorsque les checks requis par la protection de branche passent.
# => Il FAUT configurer la protection de branche (voir SECURITY.md / le README)
#    avec les checks "Build & test" et "CodeQL" requis, sinon rien ne garde la
#    barrière CI.
on: pull_request

# Permissions minimales, accordées uniquement à ce workflow.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Ne s'exécute que pour les PRs dont l'AUTEUR réel est Dependabot.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Récupérer les métadonnées Dependabot
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Une PR qui ne touche QUE des workflows réellement exécutés sur les pull
      # requests est prouvée par ses propres checks : si l'action montée casse,
      # la PR devient rouge et rien ne sera fusionné.
      #
      # Ce n'est pas le cas de `publish.yml`, déclenché uniquement par un tag :
      # une action cassée n'y apparaîtrait qu'au moment d'une release, c'est-à-
      # dire au pire moment. Ces PR-là restent en revue manuelle, quel que soit
      # le type de montée.
      - name: Déterminer si la PR est couverte par les checks
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Workflows non exercés par les checks de PR (planifiés ou sur tag).
          UNCOVERED='^\.github/workflows/(publish|release-integrity|dependency-check|signing-check|plugin-verifier)\.yml$'
          FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "Fichiers modifiés :"; echo "$FILES" | sed 's/^/  /'
          if echo "$FILES" | grep -qE "$UNCOVERED"; then
            echo "covered=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cette PR touche un workflow non couvert par les checks de PR — revue manuelle requise."
          else
            echo "covered=true" >> "$GITHUB_OUTPUT"
          fi

      # Patch et mineur : auto-merge comme avant, quel que soit l'écosystème.
      # Majeur : uniquement pour les GitHub Actions, et seulement si la PR ne
      # touche aucun workflow hors périmètre des checks. Les montées majeures
      # Gradle restent manuelles — une rupture y est bien plus subtile qu'un
      # `uses:` qui échoue immédiatement.
      - name: Activer l'auto-merge
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          (steps.meta.outputs.package-ecosystem == 'github_actions' &&
           steps.scope.outputs.covered == 'true')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
