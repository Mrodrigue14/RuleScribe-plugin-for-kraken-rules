name: Dependency review

# GitHub Advanced Security component (free on public repositories), similar to
# JFrog Xray "policy gating": fails a pull request that introduces a dependency
# with a known vulnerability (>= high) or a forbidden licence. Covers declared
# dependencies (build.gradle.kts) and GitHub Actions through the dependency graph.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          # Blocks the PR if a new dependency has a high-severity CVE.
          fail-on-severity: high
          # Strong copyleft licences, incompatible with distributing the plugin under
          # PolyForm Shield (source-available, non-compete).
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later
