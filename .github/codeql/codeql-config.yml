name: "RuleScribe CodeQL config"

# Full query suite: security (security-extended) plus code quality, much broader
# than CodeQL's default query set.
queries:
  - uses: security-and-quality

# paths-ignore has NO effect for compiled languages (java-kotlin): generated code
# is compiled and analysed anyway, so the generated parser (src/main/gen) is
# filtered out of the SARIF in the codeql.yml workflow.
