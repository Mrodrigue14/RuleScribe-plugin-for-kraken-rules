name: Setup Java + Gradle
description: >-
  Temurin JDK, Gradle (with cache) and an executable gradlew. Shares the setup
  block of build / dependency-check / plugin-verifier / publish, so a JDK or
  action version change happens in one place.

inputs:
  java-version:
    description: Temurin JDK version to install.
    required: false
    default: "17"
  cache-read-only:
    description: >-
      Do not WRITE the Gradle cache (true by default). Only build.yml writes it,
      which avoids piling up multi-GB caches (IntelliJ SDK) that would fill the
      repository's 10 GB budget.
    required: false
    default: "true"

# Inner actions are pinned to their commit SHA (tag in a comment): otherwise pinning
# THIS composite action would guarantee nothing, since it would pull mutable
# components (poutine finding "unpinnable_action"). Dependabot updates the SHA and
# the comment automatically.
runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew
