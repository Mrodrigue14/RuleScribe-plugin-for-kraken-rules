version: "1.0"

# Qodana Community for JVM, JetBrains' static analyser. It complements CodeQL:
# CodeQL analyses generic Java/Kotlin, while Qodana knows the IntelliJ Platform
# APIs and reports plugin-specific misuse.
#
# Pinned version, not `:latest`: a JDK 25 appearing in the image broke this
# analysis once, and a floating tag would bring that risk back.
linter: jetbrains/qodana-jvm-community:2026.2

profile:
  name: qodana.recommended

# No bootstrap step. The container only has a JetBrains JRE 25 (`Is JDK: false`),
# so it cannot compile; foojay cannot download a JDK under Gradle 9 (it still
# names `JvmVendorSpec.IBM_SEMERU`, removed in 9); and Qodana copies
# /data/project minus what .gitignore excludes, which includes `src/main/gen`,
# so generated sources never reach the analysis.

# The parser in src/main/gen is generated by Grammar-Kit from the BNF, so its
# warnings are not actionable. Kover coverage and the CodeQL SARIF exclude it
# too.
exclude:
  - name: All
    paths:
      - src/main/gen

  # `KotlinUnreachableCode` is excluded because there is no bootstrap. 76 of 102
  # findings had this name and sat in one 46-line file,
  # `KrakenAddOnClauseIntention.kt`, which imports the generated
  # `com.kraken.plugin.parser.KrakenTypes`. The container never gets
  # `src/main/gen`, so the unresolved symbol makes the rest of the body look
  # unreachable.
  #
  # The whole rule is excluded rather than the file because the cause is general
  # (no compiled model). Re-enable it if a bootstrap becomes possible.
  - name: KotlinUnreachableCode

  # Two style suggestions this codebase declines, excluded here rather than with
  # repeated `@Suppress`, since the decision applies to the whole repository.
  #
  # `DestructuringDeclaration` suggests `for ((a, b, c, d) in …)` on four-field
  # data classes whose loops read two or three fields. Destructuring is
  # positional: it reads worse and turns a field reorder into a silent bug.
  #
  # `IfThenToElvis` targets `if (type is Array) type else Array(type)`. The
  # `as? ?:` form is shorter but says less clearly that the function wraps what
  # is not wrapped yet.
  - name: DestructuringDeclaration
  - name: IfThenToElvis
