version: "1.0"

# Qodana Community for JVM : l'analyseur statique de JetBrains. Complémentaire
# de CodeQL plutôt que redondant — CodeQL analyse du Java/Kotlin générique,
# Qodana connaît les API de l'IntelliJ Platform et signale les usages
# incorrects propres au développement de plugins.
#
# Version épinglée, pas `:latest`. C'est un JDK 25 apparu dans l'image qui a
# fait sauter cette analyse la première fois : une étiquette flottante remet
# exactement ce risque en place, et l'action prévient à chaque run.
linter: jetbrains/qodana-jvm-community:2026.2

profile:
  name: qodana.recommended

# Résout les dépendances (dont le SDK IntelliJ) AVANT l'analyse. Sans cela,
# Qodana ouvre le projet sans pouvoir typer les API de la plateforme et déclare
# inatteignables des corps de méthode qui ne le sont pas : le premier run avait
# produit 76 faux positifs « KotlinUnreachableCode », soit 92 % du bruit total.
#
# C'est aussi cette ligne qui avait condamné Qodana : le conteneur embarque un
# JDK 25, que Gradle 8.14.5 ne savait pas lire (le build s'arrêtait sur un
# « * What went wrong: 25.0.3 »). Gradle 9.7.1 accepte Java 25, ce qui lève
# cette contradiction-là.
#
# Restait la toolchain. L'image ne contient qu'un seul JVM, `/opt/idea/jbr`,
# une JRE JetBrains 25 — pas un JDK, et pas la version demandée. Elle ne peut
# donc ni satisfaire `jvmToolchain(17)` ni compiler, et foojay-resolver ne sait
# pas en télécharger un sous Gradle 9 : 0.10.0 comme 1.0.0 nomment
# `JvmVendorSpec.IBM_SEMERU`, que Gradle 9 a supprimé. Le JDK 17 vient donc du
# runner, copié dans le répertoire de travail que Qodana monte sur
# /data/project (voir l'étape « JDK 17 pour le conteneur » du workflow).
#
# `auto-download=false` fait échouer proprement si ce chemin est faux, au lieu
# de retomber sur le resolver et son erreur IBM_SEMERU, illisible pour qui
# n'en connaît pas l'histoire.
# DIAGNOSTIC TEMPORAIRE — le JDK est bien copié (Temurin 17.0.20) et le mount
# est bien /data/project, donc ce qui reste en cause est la façon de désigner
# le chemin à Gradle. On regarde les deux formes plutôt que d'en retenter une.
bootstrap: >-
  echo "=== contenu ===" && (ls -l /data/project/.qodana-jdk/bin/java || echo ABSENT)
  && echo "=== avec -P ===" && ./gradlew -q javaToolchains
  -Porg.gradle.java.installations.paths=/data/project/.qodana-jdk || true
  && echo "=== avec -D ===" && ./gradlew -q javaToolchains
  -Dorg.gradle.java.installations.paths=/data/project/.qodana-jdk || true
  && ./gradlew classes
  -Dorg.gradle.java.installations.paths=/data/project/.qodana-jdk
  -Dorg.gradle.java.installations.auto-download=false

# Le parseur de src/main/gen est généré par Grammar-Kit depuis le BNF : ses
# avertissements ne sont pas actionnables, on ne corrige pas du code généré.
# Même exclusion que pour la couverture Kover et le SARIF CodeQL.
exclude:
  - name: All
    paths:
      - src/main/gen
      # JDK copié depuis le runner pour la toolchain, pas du code du projet.
      - .qodana-jdk
